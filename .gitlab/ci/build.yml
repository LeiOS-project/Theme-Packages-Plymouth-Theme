
workflow:
  rules:
    # Only run the pipeline for semver tags that may include a Debian revision, e.g. v1.0.0 or v1.0.0-1
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-\d+)?$/'
      when: always
    - when: never

# Stops the release before anything is built unless the tag matches the latest
# debian/changelog entry, and that version is not on the LeiOS Hub yet and
# newer than every release there.
validate-tag:
  stage: .pre
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends ca-certificates curl dpkg-dev jq
  script:
    - bash .gitlab/ci/leios-hub.sh check

build-deb:
  stage: build
  needs: [validate-tag]
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential debhelper devscripts
    # Build-Depends from debian/control
    - apt-get build-dep -y --no-install-recommends ./
  script:
    - make clean
    - make package
  artifacts:
    paths:
      - deb-build/*.deb
      - deb-build/*.changes
      - deb-build/*.buildinfo
    expire_in: 1 hour

# The theme's Plymouth plugin makes the package architecture-specific: arm64 is
# cross-compiled on the amd64 runner.
build-deb-arm64:
  stage: build
  needs: [validate-tag]
  before_script:
    - dpkg --add-architecture arm64
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential crossbuild-essential-arm64 debhelper devscripts
    # Build-Depends from debian/control, for arm64
    - apt-get build-dep -y --no-install-recommends --host-architecture arm64 ./
  script:
    - make clean
    - make package HOST_ARCH=arm64
  artifacts:
    paths:
      - deb-build/*.deb
      - deb-build/*.changes
      - deb-build/*.buildinfo
    expire_in: 1 hour
